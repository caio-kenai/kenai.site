    <script>
      // Aplica tema e idioma antes da primeira pintura para evitar flash.
      (function () {
        try {
          var t = localStorage.getItem('kenai:theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          document.documentElement.setAttribute('data-theme', t);

          var l = localStorage.getItem('kenai:lang');
          if (l !== 'pt' && l !== 'en') {
            l = (navigator.language || 'pt').toLowerCase().startsWith('pt') ? 'pt' : 'en';
          }
          document.documentElement.setAttribute('lang', l === 'pt' ? 'pt-BR' : 'en');
        } catch (e) {
          /* armazenamento indisponivel: mantem os padroes do HTML */
        }
      })();
    </script>
